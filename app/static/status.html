<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scan status · OctoScan</title>
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <style>
    @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 500; font-display: swap; src: url("/static/fonts/spacegrotesk-500.woff2") format("woff2"); }
    @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 700; font-display: swap; src: url("/static/fonts/spacegrotesk-700.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url("/static/fonts/jetbrainsmono-400.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 600; font-display: swap; src: url("/static/fonts/jetbrainsmono-600.woff2") format("woff2"); }
    :root {
      color-scheme: dark;
      --bg: #07080a; --surface: #0d1014; --surface-2: #111419;
      --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.14);
      --text: #f3efe9; --muted: #9a9ca1; --faint: #6e7278;
      --accent: #ff6a2c; --accent-dark: #b14a22; --accent-soft: rgba(255,106,44,.14);
      --accent-glow: #ffb35c;
      --ok: #4ADE80; --ok-bg: rgba(74,222,128,.12); --err: #FF8F84; --err-bg: rgba(255,143,132,.12);
      --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      --sans: "Space Grotesk", "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--sans); color: var(--text); font-size: 14px; line-height: 1.5;
      background: var(--bg); min-height: 100vh; }
    .topbar { backdrop-filter: blur(14px); background: rgba(7,8,10,.82); border-bottom: 1px solid var(--border); }
    .topbar-inner { max-width: 760px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; text-decoration: none; color: inherit; }
    .brand-name { font-size: 15px; font-weight: 700; }
    .backlink { font-size: 11.5px; font-weight: 700; font-family: var(--mono); color: var(--accent); text-decoration: none; border: 1px solid var(--border-strong); padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); }
    .backlink:hover { text-decoration: underline; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 24px 64px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    .kind { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 6px; }
    h1.target { font-size: 19px; margin: 0 0 4px; word-break: break-all; font-weight: 700; letter-spacing: -0.01em; }
    .scanid { font-family: var(--mono); font-size: 12px; color: var(--faint); margin: 0 0 16px; }
    .staterow { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .st { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 6px; padding: 3px 10px; }
    .st.completed { background: var(--ok-bg); color: var(--ok); }
    .st.failed { background: var(--err-bg); color: var(--err); }
    .st.running, .st.queued { background: var(--accent-soft); color: var(--accent-glow); }
    .st.paused { background: rgba(255,140,46,.14); color: #FF8C2E; }
    .elapsed { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .progress { margin: 14px 0 4px; }
    .progress .bar { height: 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
    .progress .fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.5s ease; }
    .stepline { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
    .stepline code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,106,44,.25); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; vertical-align: -2px; margin-right: 7px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .controls { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .btn { appearance: none; border: 1px solid transparent; border-radius: 8px; padding: 10px 22px; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; background: var(--accent); color: #1a0a02; }
    .btn:hover { background: var(--accent-dark); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn.secondary { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
    .btn.secondary:hover { background: var(--surface-2); }
    .btn.danger { background: var(--surface-2); border-color: rgba(255,143,132,.35); color: var(--err); }
    .btn.danger:hover { background: var(--err-bg); }
    .note { font-size: 12.5px; color: var(--faint); margin: 14px 0 0; }
    .errorline { font-size: 13px; color: var(--err); background: var(--err-bg); border: 1px solid rgba(255,143,132,.35); border-radius: 8px; padding: 9px 13px; margin-top: 14px; word-break: break-word; }
    .activity { margin-top: 18px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); overflow: hidden; }
    .activity h3 { margin: 0; padding: 9px 13px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 8px; }
    .nowline { padding: 9px 13px; font-size: 13px; color: var(--accent-glow); background: var(--accent-soft); border-bottom: 1px solid var(--border); font-weight: 600; }
    .feed { max-height: 240px; overflow-y: auto; padding: 6px 0; }
    .ev { display: flex; gap: 9px; padding: 3px 13px; font-size: 12.5px; color: var(--muted); font-family: var(--mono); }
    .ev .t { color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ev.done { color: var(--ok); }
    .ev.error { color: var(--err); }
    .ev.current { color: var(--accent-glow); font-weight: 600; }
    :root { --side-w: 232px; }
    #sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--side-w); z-index: 40; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 12px; gap: 2px; }
    #sidebar .side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; border-bottom: 1px solid var(--border); margin-bottom: 10px; font-weight: 700; }
    #sidebar .side-brand img, .brand img { mix-blend-mode: screen; filter: drop-shadow(0 0 8px rgba(255,106,44,.55)); }
    .side-cap { font-family: var(--mono); font-size: 10px; color: var(--faint); padding: 12px 10px 5px; }
    .side-link { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600; border: 1px solid transparent; background: none; width: 100%; text-align: left; font-family: inherit; cursor: pointer; }
    .side-link:hover { color: var(--text); background: rgba(255,255,255,.03); }
    .side-link .ico { font-family: var(--mono); font-size: 11px; color: var(--faint); width: 22px; flex: 0 0 22px; text-align: center; }
    .side-foot { margin-top: auto; border-top: 1px solid var(--border); padding-top: 10px; font-family: var(--mono); font-size: 10px; color: var(--faint); padding-left: 10px; }
    body.has-side .topbar-inner, body.has-side main { margin-left: var(--side-w); }
    #burger { display: none; background: none; border: 1px solid var(--border-strong); color: var(--text); border-radius: 8px; padding: 5px 9px; cursor: pointer; }
    #scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 35; border: 0; }
    @media (max-width: 1023px) { #sidebar { transform: translateX(-100%); transition: transform .25s ease; } body.side-open #sidebar { transform: none; } body.side-open #scrim { display: block; } body.has-side .topbar-inner, body.has-side main { margin-left: 0; } #burger { display: block; } }
  </style>
</head>
<body class="has-side">
  <button id="scrim" aria-label="close menu"></button>
  <aside id="sidebar" aria-label="Menu">
    <div class="side-brand"><img src="/static/logo.png" alt="" width="26" height="26" style="border-radius:6px" onerror="this.remove()" /> OctoScan</div>
    <div class="side-cap">Navigate</div>
    <a class="side-link" href="/"><span class="ico">←</span>All scans</a>
    <button class="side-link" id="side-results"><span class="ico">01</span>Open results</button>
    <button class="side-link" id="side-stay"><span class="ico">02</span>Cancel redirect</button>
    <div class="side-cap">Controls</div>
    <button class="side-link" id="side-pause"><span class="ico">03</span>Pause scan</button>
    <button class="side-link" id="side-resume"><span class="ico">04</span>Resume scan</button>
    <button class="side-link" id="side-finish"><span class="ico">05</span>Finish now</button>
    <div class="side-foot" id="side-stat">status: …</div>
  </aside>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="burger" aria-label="open menu">☰</button>
      <a class="brand" href="/">
        <img src="/static/logo.png" alt="OctoScan logo" width="28" height="28" style="border-radius:6px" />
        <span class="brand-name">OctoScan</span>
      </a>
      <input id="api-key" type="password" placeholder="API key" autocomplete="off" aria-label="API key" style="font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface-2);color:var(--text);width:160px;" />
      <a class="backlink" href="/">All scans</a>
    </div>
  </header>
  <main>
    <div class="card" id="card">
      <p class="kind" id="kind">Loading…</p>
      <h1 class="target" id="target">—</h1>
      <p class="scanid" id="scanid"></p>
      <div class="staterow"><span class="st queued" id="state">…</span><span class="elapsed" id="elapsed"></span></div>
      <div class="progress"><div class="bar"><div class="fill" id="fill" style="width:4%;"></div></div></div>
      <p class="stepline" id="steps"></p>
      <div class="activity" id="activity" style="display:none;">
        <h3><span class="spinner" id="act-spinner" style="display:none;"></span>Live activity</h3>
        <div class="nowline" id="nowline" style="display:none;"></div>
        <div class="feed" id="feed"></div>
      </div>
      <div id="errbox"></div>
      <div class="controls">
        <button class="btn secondary" id="btn-pause" type="button" style="display:none;">Pause</button>
        <button class="btn" id="btn-resume" type="button" style="display:none;">Resume</button>
        <button class="btn danger" id="btn-finish" type="button" style="display:none;">Finish now</button>
        <a class="btn" id="btn-results" href="#" style="display:none; text-decoration:none;">Open results</a>
        <button class="btn secondary" id="btn-stay" type="button" style="display:none;">Stay here (cancel redirect)</button>
      </div>
      <p class="note" id="note"></p>
    </div>
  </main>
  <script>
    const parts = location.pathname.split("/").filter(Boolean);
    const isRepo = parts[0] === "repos";
    const scanId = parts[1] || "";
    const apiBase = (isRepo ? "/api/repo-scans/" : "/api/scans/") + encodeURIComponent(scanId);
    const resultUrl = (isRepo ? "/repos/" : "/scans/") + encodeURIComponent(scanId);
    const keyInput = document.getElementById("api-key");
    keyInput.value = localStorage.getItem("apiKey") || "";
    keyInput.addEventListener("change", () => localStorage.setItem("apiKey", keyInput.value.trim()));
    const headers = {};
    function hdrs() {
      const h = Object.assign({ "Content-Type": "application/json" }, headers);
      const k = (keyInput.value || "").trim();
      if (k) h["X-API-Key"] = k;
      return h;
    }

    const kindEl = document.getElementById("kind");
    const targetEl = document.getElementById("target");
    const idEl = document.getElementById("scanid");
    const stateEl = document.getElementById("state");
    const elapsedEl = document.getElementById("elapsed");
    const fillEl = document.getElementById("fill");
    const stepsEl = document.getElementById("steps");
    const errBox = document.getElementById("errbox");
    const noteEl = document.getElementById("note");
    const btnPause = document.getElementById("btn-pause");
    const btnResume = document.getElementById("btn-resume");
    const btnFinish = document.getElementById("btn-finish");
    const btnResults = document.getElementById("btn-results");
    const btnStay = document.getElementById("btn-stay");
    let stayHere = false;
    btnStay.addEventListener("click", () => { stayHere = true; btnStay.style.display = "none"; noteEl.textContent = "Auto-redirect cancelled — stay here as long as needed."; });
    btnResults.href = resultUrl;

    const t0 = Date.now();
    const clock = setInterval(() => {
      elapsedEl.textContent = "elapsed " + Math.floor((Date.now() - t0) / 1000) + "s";
    }, 1000);

    function esc(s) {
      return (s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function showButtons(state) {
      const running = state === "running" || state === "queued";
      btnPause.style.display = running ? "" : "none";
      btnResume.style.display = state === "paused" ? "" : "none";
      btnFinish.style.display = (running || state === "paused") ? "" : "none";
      btnResults.style.display = (state === "completed" || state === "failed") ? "" : "none";
      if (btnStay) btnStay.style.display = (state === "completed" || state === "failed") ? "" : "none";
    }
    async function control(action, btn) {
      btn.disabled = true;
      try {
        const res = await fetch(apiBase + "/" + action, { method: "POST", headers: hdrs() });
        if (!res.ok) {
          errBox.innerHTML = `<div class="errorline">${esc(action)} failed (${res.status}): ${esc((await res.text()).slice(0, 200))}</div>`;
        } else {
          errBox.innerHTML = "";
          await tick();
        }
      } catch (e) {
        errBox.innerHTML = `<div class="errorline">${esc(action)} failed: connection error.</div>`;
      }
      btn.disabled = false;
    }
    btnPause.addEventListener("click", () => control("pause", btnPause));
    btnResume.addEventListener("click", () => control("resume", btnResume));
    btnFinish.addEventListener("click", () => control("finish", btnFinish));

    let done = false;
    const activityEl = document.getElementById("activity");
    const nowlineEl = document.getElementById("nowline");
    const feedEl = document.getElementById("feed");
    const actSpinner = document.getElementById("act-spinner");
    let seenEvents = 0;

    async function tickActivity() {
      try {
        const res = await fetch(apiBase + "/activity", { headers: hdrs() });
        if (!res.ok) { activityEl.style.display = "none"; return; }
        const data = await res.json();
        const events = data.events || [];
        if (!events.length && !data.current) { activityEl.style.display = "none"; return; }
        activityEl.style.display = "";
        const running = !done;
        actSpinner.style.display = running ? "" : "none";
        if (data.current) {
          nowlineEl.style.display = "";
          nowlineEl.textContent = "▶ " + data.current;
        } else {
          nowlineEl.style.display = "none";
        }
        if (events.length !== seenEvents) {
          seenEvents = events.length;
          feedEl.innerHTML = events.slice(-40).map(ev => {
            const t = new Date(ev.ts * 1000).toLocaleTimeString();
            return `<div class="ev ${esc(ev.kind)}"><span class="t">${t}</span><span>${esc(ev.msg)}</span></div>`;
          }).join("");
          feedEl.scrollTop = feedEl.scrollHeight;
        }
      } catch (e) { /* activity is best-effort */ }
    }

    async function tick() {
      let res;
      try {
        res = await fetch(apiBase, { headers: hdrs() });
      } catch (e) {
        kindEl.textContent = "Connection error";
        targetEl.textContent = "Could not reach the API.";
        idEl.textContent = "";
        return;
      }
      if (res.status === 403) {
        kindEl.textContent = "Locked";
        targetEl.textContent = "This server requires an API key.";
        idEl.textContent = "";
        noteEl.innerHTML = 'Enter the key above (saved to this browser) — then reload.';
        showButtons("locked");
        clearInterval(poll);
        return;
      }
      if (res.status === 404) {
        kindEl.textContent = "Not found";
        targetEl.textContent = "No such scan.";
        idEl.textContent = esc(scanId);
        showButtons("missing");
        clearInterval(poll);
        return;
      }
      const job = await res.json();
      const label = isRepo ? job.repo_url : job.target_url;
      kindEl.textContent = (isRepo ? "Codebase scan" : "Web scan") + (job.status === "paused" ? " · paused" : "");
      targetEl.textContent = label || scanId;
      idEl.textContent = "id " + job.id;
      stateEl.className = "st " + job.status;
      stateEl.textContent = job.status;
      const nSteps = (job.scanners_run || []).length;
      const pct = job.status === "completed" ? 100 : job.status === "failed" ? 100 : Math.min(92, 8 + nSteps * 14);
      fillEl.style.width = pct + "%";
      const doneList = (job.scanners_run || []).map(s => `<code>${esc(s)}</code>`).join(" ");
      stepsEl.innerHTML = nSteps
        ? `${nSteps} step${nSteps === 1 ? "" : "s"} finished: ${doneList}`
        : "Starting…";
      if (isRepo && job.files_scanned) {
        stepsEl.innerHTML += ` · ${job.files_scanned} files indexed`;
      }
      errBox.innerHTML = (job.error && job.status === "failed")
        ? `<div class="errorline">${esc(job.error)}</div>` : "";
      if (job.error && job.status === "completed") {
        noteEl.textContent = job.error;
      }
      showButtons(job.status);
      if ((job.status === "completed" || job.status === "failed") && !done) {
        done = true;
        clearInterval(poll);
        clearInterval(clock);
        clearInterval(actPoll);
        tickActivity();
        noteEl.textContent = "Finished — opening the result page in 6s (or press Stay here)…";
        showButtons(job.status);
        setTimeout(() => { if (!stayHere) location.href = resultUrl; }, 6000);
        return;
      }
    }
    const poll = setInterval(tick, 2500);
    const actPoll = setInterval(tickActivity, 2500);
    tick();
    tickActivity();
  </script>
  <script>
    document.getElementById("burger").addEventListener("click", () => document.body.classList.toggle("side-open"));
    document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("side-open"));
    const click = (id) => { const b = document.getElementById(id); if (b && b.style.display !== "none") b.click(); };
    document.getElementById("side-pause").addEventListener("click", () => click("btn-pause"));
    document.getElementById("side-resume").addEventListener("click", () => click("btn-resume"));
    document.getElementById("side-finish").addEventListener("click", () => click("btn-finish"));
    document.getElementById("side-stay").addEventListener("click", () => click("btn-stay"));
    document.getElementById("side-results").addEventListener("click", () => click("btn-results"));
    setInterval(() => {
      const s = document.getElementById("state"), e = document.getElementById("elapsed"), ss = document.getElementById("side-stat");
      if (s && ss) ss.textContent = "status: " + s.textContent + (e ? " · " + e.textContent : "");
    }, 1000);
  </script>
</body>
</html>
