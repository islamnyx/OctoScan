rules:
  - id: android-hardcoded-secret-token
    languages: [java]
    severity: WARNING
    message: A token-like literal is assigned in source. Hardcoded credentials
      and API keys ship in every build and can be extracted from the binary.
      Load secrets from a secure backend / keystore and rotate any published key.
    patterns:
      - pattern: $VALUE = "...";
      - metavariable-regex:
          metavariable: $VALUE
          regex: ('?)(sk-|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]+PRIVATE KEY|eyJ[A-Za-z0-9_-]{10,}\.eyJ)
    metadata:
      cwe: [CWE-798]
      category: secrets