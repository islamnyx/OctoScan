rules:
  - id: android-weak-message-digest
    languages: [java]
    severity: ERROR
    message: Weak message digest "$ALGO" used. MD5 and SHA-1 are cryptographically
      broken for security purposes (collisions are practical). Use SHA-256 or higher
      via a provider such as a KeyedHash / MAC where keyed integrity is required.
    patterns:
      - pattern: MessageDigest.getInstance("$ALGO")
      - metavariable-regex:
          metavariable: $ALGO
          regex: (?i)(md5|sha-?1)
    metadata:
      cwe: [CWE-327]
      category: cryptography

  - id: android-weak-cipher-transformation
    languages: [java]
    severity: ERROR
    message: Weak cipher transformation "$TRANS" used. DES is brute-forceable
      and ECB mode leaks plaintext patterns (identical blocks encrypt
      identically). Use AES/GCM/NoPadding (or ChaCha20-Poly1305) with a
      random IV.
    patterns:
      - pattern: Cipher.getInstance("$TRANS")
      - metavariable-regex:
          metavariable: $TRANS
          regex: (?i).*(des|ecb).*
    metadata:
      cwe: [CWE-327]
      category: cryptography

  - id: android-ecb-secret-key
    languages: [java]
    severity: ERROR
    message: SecretKeySpec requests "$TRANS" — a DES/ECB construction.
      ECB is not semantically secure; identical plaintext blocks produce
      identical ciphertext. Use AES/GCM with a random IV.
    patterns:
      - pattern: new SecretKeySpec($KEY, "$TRANS")
      - metavariable-regex:
          metavariable: $TRANS
          regex: (?i).*(des|ecb).*
    metadata:
      cwe: [CWE-327]
      category: cryptography

  - id: android-aes-default-mode
    languages: [java]
    severity: WARNING
    message: Cipher.getInstance("AES") with no explicit mode/padding falls
      back to the provider default, which on Android is ECB. State the
      transformation explicitly (e.g. "AES/GCM/NoPadding").
    patterns:
      - pattern: Cipher.getInstance("AES")
    metadata:
      cwe: [CWE-327]
      category: cryptography